<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Pintar Berhadiah</title>
    <style>
        :root {
            --sky: #e1f5fe;
            --bubble-color: rgba(0, 188, 212, 0.2);
            --bubble-border: #00acc1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #eceff1;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-box {
            width: 95%;
            max-width: 600px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: #263238;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        #visual-frame {
            height: 220px;
            background: linear-gradient(to bottom, var(--sky), #ffffff);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            border-bottom: 2px solid #cfd8dc;
        }

        #bubble {
            width: 40px;
            height: 40px;
            background: var(--bubble-color);
            border: 2px solid var(--bubble-border);
            border-radius: 50%;
            margin-bottom: 20px;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset -5px -5px 15px rgba(255,255,255,0.5);
            z-index: 5;
        }

        .money {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes moneyFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(350px) rotate(360deg); opacity: 0; }
        }

        #quiz-area { padding: 25px; text-align: center; }
        #question { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; min-height: 50px; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .opt-btn {
            padding: 15px;
            border: 2px solid #b0bec5;
            background: #fafafa;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .opt-btn:hover { background: #e0f7fa; border-color: #00acc1; }

        #feedback-box {
            display: none;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
        }
        .correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; }
        .wrong { background: #ffebee; color: #c62828; border: 1px solid #ef5350; }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: #263238;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Result Screen */
        #result-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .trophy-wrap {
            position: relative;
            width: 140px; height: 140px;
            display: flex; justify-content: center; align-items: center;
        }

        .rays {
            position: absolute;
            width: 180px; height: 180px;
            background: repeating-conic-gradient(from 0deg, rgba(255,215,0,0.3) 0deg 15deg, transparent 15deg 30deg);
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }

        .trophy { font-size: 70px; position: relative; z-index: 2; animation: bounce 2s infinite; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /*    .stat-table {
            width: 100%;
            margin: 15px 0;
            font-size: 0.9rem;
            border-collapse: collapse;
        } */
    /*    .stat-table td { padding: 5px; border-bottom: 1px solid #eee; }  */
        
        /* di bawah ini koding dari file index.html */
        .stat-table {
            width: 100%;
            margin: 15px 0;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .stat-table th, .stat-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .stat-table th { background-color: #f2f2f2; }

    </style>
</head>
<body>

<div id="game-box">
    <div class="header" id="stats-header">
        <div>Soal: <span id="q-idx">0</span>/<span id="q-total">0</span></div>
        <div>Murni: <span id="sc-m">0</span> | Ulang: <span id="sc-u">0</span></div>
    </div>

    <div id="visual-frame">
        <div id="bubble"></div>
        <div id="money-box"></div>
    </div>

    <div id="quiz-area">
        <div id="q-content">
            <div id="question">Memuat soal...</div>
            <div class="options-grid" id="options"></div>
        </div>

        <div id="feedback-box">
            <div id="fb-text"></div>
            <button class="action-btn" onclick="nextStep()">Lanjut</button>
        </div>
    </div>

    <div id="result-screen">
        <div class="trophy-wrap">
            <div class="rays"></div>
            <div class="trophy">🏆</div>
        </div>
        <h3 id="grade-msg" style="margin: 10px 0; color: #2e7d32;"></h3>
        
        <!--<table class="stat-table">
            <tr><td>Jawaban Langsung</td><td id="res-m-count">0</td></tr>
            <tr><td>Jawaban Mengulang</td><td id="res-u-count">0</td></tr>
            <tr><td><b>Nilai Langsung</b></td><td><b id="res-m-val">0</b></td></tr>
            <tr><td><b>Nilai Mengulang</b></td><td><b id="res-u-val">0</b></td></tr>
        </table>

        <button class="action-btn" style="background: #d32f2f;" onclick="forceClose()">Close</button>

    <!-- ini dari file index.html -->
        <table class="stat-table">
            <tr>
                <th>Kategori</th>
                <th>Jumlah</th>
                <th>Nilai</th>
            </tr>
            <tr>
                <td>Jawab Langsung</td>
                <td id="res-m-count">0</td>
                <td id="res-m-val">0</td>
            </tr>
            <tr>
                <td>Jawab Mengulang</td>
                <td id="res-u-count">0</td>
                <td id="res-u-val">0</td>
            </tr>
            <tr style="font-weight: bold; background: #e0f2f1;">
                <td>Total Skor</td>
                <td colspan="2" id="res-total">0</td>
            </tr>
        </table>

        <!--<button class="btn-action" style="max-width: 150px; background: #d32f2f;" onclick="closeGame()">Close</button>-->
        <button class="action-btn" style="background: #d32f2f;" onclick="forceClose()">Close</button>

    </div>
</div>

<script>
    const bankSoal = [
        { q: "Apa ibukota negara Indonesia saat ini?", a: ["Surabaya", "Jakarta", "IKN", "Bandung"], c: 1, e: "Jakarta adalah ibukota saat ini." },
        { q: "Lambang negara Indonesia adalah...", a: ["Padi Kapas", "Rantai", "Garuda Pancasila", "Pohon Beringin"], c: 2, e: "Garuda Pancasila adalah lambang negara kita." },
        { q: "Warna bendera Indonesia adalah...", a: ["Merah Putih", "Putih Merah", "Merah Kuning", "Biru Putih"], c: 0, e: "Bendera kita adalah Sang Merah Putih." },
        { q: "Dasar negara Indonesia adalah...", a: ["UUD 45", "Proklamasi", "Pancasila", "Kepres"], c: 2, e: "Pancasila terdiri dari lima dasar." }
    ];

    let current = 0;
    let countMurni = 0;
    let countUlang = 0;
    let isRepeating = false;
    let bSize = 10; //40;
    const pointWeight = 100 / bankSoal.length;

    function init() {
        document.getElementById('q-total').innerText = bankSoal.length;
        loadQ();
    }

    function loadQ() {
        const d = bankSoal[current];
        document.getElementById('q-idx').innerText = current + 1;
        document.getElementById('question').innerText = d.q;
        document.getElementById('q-content').style.display = 'block';
        document.getElementById('feedback-box').style.display = 'none';

        const opt = document.getElementById('options');
        opt.innerHTML = '';
        d.a.forEach((t, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = t;
            b.onclick = () => check(i);
            opt.appendChild(b);
        });
    }

    function check(idx) {
        const d = bankSoal[current];
        const fb = document.getElementById('feedback-box');
        const txt = document.getElementById('fb-text');

        document.getElementById('q-content').style.display = 'none';
        fb.style.display = 'block';

        if (idx === d.c) {
            fb.className = 'correct';
            if (!isRepeating) {
                countMurni++;
                bSize += 35;
                updateBubble();
                txt.innerHTML = "<b>Luar Biasa!</b> Jawabanmu tepat.";
            } else {
                countUlang++;
                txt.innerHTML = "<b>Bagus!</b> Kamu sudah memperbaikinya.";
            }
        } else {
            fb.className = 'wrong';
            txt.innerHTML = `<b>Kurang Tepat.</b><br>Kunci: ${d.a[d.c]}<br>Penjelasan: ${d.e}`;
            isRepeating = true;
        }
        
        document.getElementById('sc-m').innerText = countMurni;
        document.getElementById('sc-u').innerText = countUlang;
    //    document.getElementById('sc-m').innerText = Math.round(countMurni * pointWeight);
    //    document.getElementById('sc-u').innerText = Math.round(countUlang * pointWeight);
    }

    function updateBubble() {
        const b = document.getElementById('bubble');
        b.style.width = bSize + 'px';
        b.style.height = bSize + 'px';
    }

    function nextStep() {
        if (isRepeating && document.getElementById('feedback-box').className === 'wrong') {
            loadQ();
        } else {
            isRepeating = false;
            current++;
            if (current < bankSoal.length) {
                loadQ();
            } else {
                showFinal();
            }
        }
    }

    function showFinal() {
        // Efek Meletus
        const b = document.getElementById('bubble');
        b.style.transform = 'scale(1.8)';
        b.style.opacity = '0';
        
        // Hujan Uang
        for(let i=0; i<40; i++) {
            setTimeout(() => {
                const m = document.createElement('div');
                m.className = 'money';
                m.innerText = '💵';
                m.style.left = Math.random() * 90 + '%';
                m.style.top = '-50px';
                m.style.animation = `moneyFall ${Math.random() * 2 + 1}s linear forwards`;
                document.getElementById('money-box').appendChild(m);
            }, i * 80);
        }

        const scoreLangsung = Math.round(countMurni * pointWeight);
        const scoreUlang = Math.round(countUlang * pointWeight);
        const msgEl = document.getElementById('grade-msg');

        // Logika Grade Dinamis
        if (scoreLangsung >= 96) {
            msgEl.innerText = "Anda Anak Hebat Sekali, Tingkatkan dan Pertahankan Prestasi Anda";
        } else if (scoreLangsung >= 81) {
            msgEl.innerText = "Anda Anak Hebat, Membaca lebih tekun lagi Tingkatkan Prestasi Anda";
        } else if (scoreLangsung >= 71) {
            msgEl.innerText = "Anda Anak Pintar, Banyak Membaca lebih Giat lagi";
        } else if (scoreLangsung >= 61) {
            msgEl.innerText = "Anda Anak Baik, Kurangi Waktu Main Anda dan Membaca lebih tekun lagi Tingkatkan Prestasi Anda";
        } else {
            msgEl.innerText = "Tetap Semangat, Belajar Lebih Giat Lagi Ya!";
            msgEl.style.color = "#c62828";
        }

        document.getElementById('res-m-count').innerText = countMurni;
        document.getElementById('res-u-count').innerText = countUlang;
        document.getElementById('res-m-val').innerText = scoreLangsung;
        document.getElementById('res-u-val').innerText = scoreUlang;

        // dibawah ini diberi tambahan sendiri, di coba sukses sesuai harapan
        document.getElementById('res-total').innerText = scoreLangsung+scoreUlang;

        setTimeout(() => {
            document.getElementById('result-screen').style.display = 'flex';
        }, 1800);
    }

    function forceClose() {
        // Menyamarkan file dengan menghapus seluruh konten dan menggantinya
        alert("Nantikan Soal Latihan berikutnya, Salam Sukses");
        document.body.innerHTML = `
            <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#263238; color:white; text-align:center; font-family:sans-serif;">
                <h1 style="font-size:2rem;">Salam Sukses!</h1>
                <p style="opacity:0.7;">Sesi latihan telah selesai secara aman.</p>
            </div>
        `;
        // Mencoba menutup tab (hanya berhasil jika dibuka lewat script)
        window.close();
    }

    init();
</script>
</body>
</html>
