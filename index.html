<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Cerdas Finansial</title>
    <style>
        :root {
            --sky: #e1f5fe;
            --bubble-color: rgba(0, 188, 212, 0.3);
            --bubble-border: #00acc1;
            --dark: #37474f;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eceff1;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-box {
            width: 95%;
            max-width: 600px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* Stats Bar */
        .header {
            background: var(--dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        /* Visual Area */
        #visual-frame {
            height: 220px;
            background: linear-gradient(to bottom, var(--sky), #ffffff);
            position: relative;
            overflow: hidden;
            border-bottom: 3px solid #cfd8dc;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bubble {
            width: 50px;
            height: 50px;
            background: var(--bubble-color);
            border: 2px solid var(--bubble-border);
            border-radius: 50%;
            margin-bottom: 20px;
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset -10px -10px 15px rgba(255,255,255,0.4);
            z-index: 5;
        }

        /* Money Rain */
        .money {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes moneyFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(350px) rotate(360deg); opacity: 0; }
        }

        /* Quiz Area */
        #quiz-area { padding: 25px; text-align: center; }
        #question { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; min-height: 50px; color: #263238; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .opt-btn {
            padding: 15px;
            border: 2px solid #b0bec5;
            background: #fafafa;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .opt-btn:hover { background: #e0f7fa; border-color: #00acc1; }

        /* Feedback */
        #feedback-box {
            display: none;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            text-align: left;
        }
        .correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #4caf50; }
        .wrong { background: #ffebee; color: #c62828; border: 1px solid #ef5350; }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Win Screen & Table */
        #win-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .stat-table {
            width: 100%;
            margin: 15px 0;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .stat-table th, .stat-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .stat-table th { background-color: #f2f2f2; }

        .trophy-wrap {
            position: relative;
            width: 140px; height: 140px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 10px;
        }

        .rays {
            position: absolute;
            width: 180px; height: 180px;
            background: repeating-conic-gradient(from 0deg, rgba(255,215,0,0.3) 0deg 15deg, transparent 15deg 30deg);
            border-radius: 50%;
            animation: rotateRays 4s linear infinite;
        }

        .trophy { font-size: 70px; position: relative; z-index: 2; animation: bounce 2s infinite; }

        @keyframes rotateRays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    </style>
</head>
<body>

<div id="game-box">
    <div class="header">
        <div>Soal: <span id="q-done">0</span>/<span id="q-total">0</span></div>
        <div>Murni: <span id="disp-m">0</span> | Ulang: <span id="disp-u">0</span></div>
    </div>

    <div id="visual-frame">
        <div id="bubble"></div>
        <div id="money-container"></div>
    </div>

    <div id="quiz-area">
        <div id="q-container">
            <div id="question">Memuat soal...</div>
            <div class="options-grid" id="options"></div>
        </div>

        <div id="feedback-box">
            <div id="fb-text"></div>
            <button class="btn-action" onclick="processNext()">Lanjut</button>
        </div>
    </div>

    <div id="win-screen">
        <div class="trophy-wrap">
            <div class="rays"></div>
            <div class="trophy">🏆</div>
        </div>
        <h3 id="grade-msg" style="margin: 5px 0;">Memproses Nilai...</h3>
        
        <table class="stat-table">
            <tr>
                <th>Kategori</th>
                <th>Jumlah</th>
                <th>Nilai</th>
            </tr>
            <tr>
                <td>Jawab Langsung</td>
                <td id="res-m-count">0</td>
                <td id="res-m-val">0</td>
            </tr>
            <tr>
                <td>Jawab Mengulang</td>
                <td id="res-u-count">0</td>
                <td id="res-u-val">0</td>
            </tr>
            <tr style="font-weight: bold; background: #e0f2f1;">
                <td>Total Skor</td>
                <td colspan="2" id="res-total">0</td>
            </tr>
        </table>

        <button class="btn-action" style="max-width: 150px; background: #d32f2f;" onclick="closeGame()">Close</button>
    </div>
</div>

<script>
    // Silakan tambah soal di sini. Sistem skor akan menyesuaikan otomatis.
    const bankSoal = [
        { q: "Apa nama mata uang resmi Indonesia?", a: ["Ringgit", "Dollar", "Rupiah", "Yen"], c: 2, e: "Rupiah adalah mata uang resmi Indonesia." },
        { q: "Menabung uang sebaiknya dilakukan di...", a: ["Bawah bantal", "Bank", "Kantong celana", "Halaman"], c: 1, e: "Bank adalah tempat menyimpan uang paling aman." },
        { q: "Membeli barang sesuai kebutuhan disebut...", a: ["Boros", "Hemat", "Kikir", "Serakah"], c: 1, e: "Hemat adalah menggunakan uang sesuai kebutuhan." },
        { q: "Barang yang digunakan sebagai alat tukar sah adalah...", a: ["Batu", "Uang", "Daun", "Garam"], c: 1, e: "Uang adalah alat tukar yang sah." },
        { q: "QRIS adalah alat pembayaran berbentuk...", a: ["Kertas", "Logam", "Digital", "Barter"], c: 2, e: "QRIS adalah standar pembayaran digital di Indonesia." }
    ];

    let current = 0;
    let countMurni = 0;
    let countUlang = 0;
    let isRepeating = false;
    let bubbleSize = 50;

    const totalSoal = bankSoal.length;
    const poinPerSoal = 100 / totalSoal;

    function init() {
        document.getElementById('q-total').innerText = totalSoal;
        loadQuestion();
    }

    function loadQuestion() {
        const data = bankSoal[current];
        document.getElementById('q-done').innerText = current + 1;
        document.getElementById('question').innerText = data.q;
        document.getElementById('q-container').style.display = 'block';
        document.getElementById('feedback-box').style.display = 'none';

        const grid = document.getElementById('options');
        grid.innerHTML = '';
        data.a.forEach((txt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = txt;
            btn.onclick = () => checkAnswer(i);
            grid.appendChild(btn);
        });
    }

    function checkAnswer(idx) {
        const data = bankSoal[current];
        const fb = document.getElementById('feedback-box');
        const fbTxt = document.getElementById('fb-text');

        document.getElementById('q-container').style.display = 'none';
        fb.style.display = 'block';

        if (idx === data.c) {
            fb.className = 'correct';
            if (!isRepeating) {
                countMurni++;
                bubbleSize += (180 / totalSoal); // Gelembung membesar perlahan
                updateBubble();
                fbTxt.innerHTML = "<b>Benar!</b> Jawabanmu tepat sekali.";
            } else {
                countUlang++;
                fbTxt.innerHTML = "<b>Bagus!</b> Kamu berhasil memperbaiki jawaban.";
            }
        } else {
            fb.className = 'wrong';
            fbTxt.innerHTML = `<b>Kurang Tepat</b><br>Kunci: ${data.a[data.c]}<br>Penjelasan: ${data.e}`;
            isRepeating = true;
        }
        
        document.getElementById('disp-m').innerText = countMurni;
        document.getElementById('disp-u').innerText = countUlang;
    }

    function updateBubble() {
        const b = document.getElementById('bubble');
        b.style.width = bubbleSize + 'px';
        b.style.height = bubbleSize + 'px';
    }

    function processNext() {
        const isWrong = document.getElementById('feedback-box').className === 'wrong';
        if (isRepeating && isWrong) {
            loadQuestion();
        } else {
            isRepeating = false;
            current++;
            if (current < totalSoal) {
                loadQuestion();
            } else {
                finishGame();
            }
        }
    }

    function finishGame() {
        // Efek Meletus
        const b = document.getElementById('bubble');
        b.style.transform = 'scale(1.5)';
        b.style.opacity = '0';
        
        // Hujan Uang
        for(let i=0; i<40; i++) {
            setTimeout(createMoney, i * 80);
        }

        // Hitung Statistik Akhir
        const nilaiMurni = countMurni * poinPerSoal;
        const nilaiUlang = countUlang * poinPerSoal;
        const totalSkor = nilaiMurni + nilaiUlang;

        document.getElementById('res-m-count').innerText = countMurni;
        document.getElementById('res-m-val').innerText = nilaiMurni.toFixed(1);
        document.getElementById('res-u-count').innerText = countUlang;
        document.getElementById('res-u-val').innerText = nilaiUlang.toFixed(1);
        document.getElementById('res-total').innerText = totalSkor.toFixed(1);

        // Grade Ucapan
        const msgEl = document.getElementById('grade-msg');
        if (totalSkor >= 96) {
            msgEl.innerText = "Anda Anak Hebat Sekali, Tingkatkan dan Pertahankan Presatasi Anda";
        } else if (totalSkor >= 81) {
            msgEl.innerText = "Anda Anak Hebat, Membaca lebih tekun lagi Tingkatkan Presatasi Anda";
        } else if (totalSkor >= 71) {
            msgEl.innerText = "Anda Anak Pintar, Banyak Membaca lebih Giat lagi";
        } else if (totalSkor >= 61) {
            msgEl.innerText = "Anda Anak Baik, Kurangi Waktu Main Anda dan Membaca lebih tekun lagi";
        } else {
            msgEl.innerText = "Ayo Semangat Lagi Belajarnya!";
        }

        setTimeout(() => {
            document.getElementById('win-screen').style.display = 'flex';
        }, 2000);
    }

    function createMoney() {
        const money = document.createElement('div');
        money.className = 'money';
        money.innerText = '💵';
        money.style.left = Math.random() * 80 + 10 + '%';
        money.style.top = '-50px';
        money.style.animation = `moneyFall ${Math.random() * 2 + 1}s linear forwards`;
        document.getElementById('money-container').appendChild(money);
        setTimeout(() => money.remove(), 3000);
    }

    function closeGame() {
        alert("Nantikan Soal Latihan berikutnya, Salam Sukses");
    }

    init();
</script>
</body>
</html>
